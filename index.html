<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlantPal - AI Plant Care Companion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button
      class="menu-button global-menu-button"
      id="menuButton"
      type="button"
      aria-label="Open menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <button id="themeToggle" class="global-theme-toggle" type="button">
      Dark Mode
    </button>

    <aside class="sidebar drawer-sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <h3>Explore</h3>

        <button type="button" class="nav-item active" id="sidebarHomeButton">Home</button>
        <button type="button" class="nav-item" id="sidebarAskButton">Ask PlantPal</button>
        <button type="button" class="nav-item">Diagnose a Problem</button>
        <button type="button" class="nav-item">Find your Houseplant</button>
        <button type="button" class="nav-item">Care Guide</button>
        <button type="button" class="nav-item">Watering Schedule</button>
        <button type="button" class="nav-item">Pet Safety</button>
      </nav>

      <div class="quick-topics">
        <h3>Quick Topics</h3>

        <button type="button" class="topic-btn">Yellow Leaves</button>
        <button type="button" class="topic-btn">Brown Tips</button>
        <button type="button" class="topic-btn">Overwatering</button>
        <button type="button" class="topic-btn">Low Light plants</button>
      </div>

      <div class="coming-soon">
        <h3>Coming Soon</h3>
        <p>My Plants</p>
        <p>Care Reminders</p>
      </div>
    </aside>

    <section class="landing-page">
      <header class="landing-header">
        <span></span>
        <p class="landing-logo">PlantPal</p>
      </header>

      <div class="landing-frame">
        <div class="corner-vine top-left">
          <span class="leaf leaf-one"></span>
          <span class="leaf leaf-two"></span>
          <span class="leaf leaf-three"></span>
        </div>

        <div class="corner-flower top-right">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="corner-flower bottom-left">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="landing-content">
          <p class="eyebrow">Plant Care Corner</p>

          <h1>PlantPal</h1>

          <p class="landing-subtitle">
            Your guide to happier, healthier houseplants.
          </p>

          <div class="landing-actions">
            <button type="button" id = "startChatButton">Ask PlantPal</button>
            <button type="button">Diagnose</button>
            <button type="button">Care Guide</button>
            <button type="button">Watering Plan</button>
          </div>
        </div>
      </div>
    </section>

    <div class="app hidden">
      <main class="chat-section">
        <header class="chat-header">
          <div>
            <h2>Ask PlantPal</h2>
            <p>Get help with watering, sunlight, pests, and plant problems.</p>
          </div>
          <div class="chat-header-actions">
            <button id="homeButton" type="button">Home</button>
          </div>
        </header>

        <section id="chatMessages" class="chat-messages">
          <div class="message bot">
            Hi! I'm PlantPal. Ask me anything about your house plants.
          </div>
        </section>

        <form id="chatForm" class="chat-form">
          <input
            type="text"
            id="userInput"
            placeholder="Ask about your plant..."
            autocomplete="off"
          />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
